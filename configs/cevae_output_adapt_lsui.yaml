# CE-VAE + TUDA Output-Level Adversarial Adaptation
# Fine-tunes from pre-trained CE-VAE checkpoint with PatchGAN + WGAN-GP
# This is the most impactful TUDA component for paired-data score improvement.
# Optimized for single T4 GPU (Kaggle/Colab).

model:
  target: src.models.cevae.CEVAE
  params:
    discriminator: True
    ckpt_path: data/lsui-cevae-epoch119.ckpt
    embed_dim: 256

    ddconfig:
      double_z: False
      z_channels: 256
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult: [1, 1, 2, 2, 4]
      num_res_blocks: 2
      attn_resolutions: [16]
      dropout: 0.0

    lossconfig:
      target: src.modules.losses.combined.ReconstructionLossWithDiscriminator
      params:
        pixelloss_weight: 10.0
        perceptual_weight: 1.0
        ssim_loss_weight: 1.0
        gdl_loss_weight: 0.5
        color_loss_weight: 0.5
        # Output-level adversarial adaptation (TUDA-inspired WGAN-GP)
        disc_enabled: True
        disc_conditional: False
        disc_in_channels: 3
        disc_start: 0        # Start immediately (fine-tuning from good checkpoint)
        disc_weight: 0.5
        disc_loss: wgan_gp   # TUDA-style WGAN-GP for stability
        gp_weight: 10.0      # Gradient penalty weight (TUDA default)

    optimizer:
      base_learning_rate: 4.5e-6

lightning:
  trainer:
    max_epochs: 10
    accelerator: gpu
    devices: 1
    precision: 16-mixed
    check_val_every_n_epoch: 2

data:
  target: src.data.dataset_wrapper.DataModuleFromConfig
  params:
    dataset_name: "LSUI"
    train_batch_size: 6
    val_batch_size: 8
    num_workers: 2
    train:
      target: src.data.image_enhancement.DatasetTrainFromImageFileList
      params:
        training_images_list_file: data/LSUI_train_input.txt
        target_images_list_file: data/LSUI_train_target.txt
        random_crop: True
        random_flip: True
        color_jitter:
          brightness: [0.9, 1.1]
          contrast: [0.9, 1.1]
          saturation: [0.9, 1.1]
          hue: [-0.02, 0.02]
        max_size: 288
        size: 256
    validation:
      target: src.data.image_enhancement.DatasetTestFromImageFileList
      params:
        test_images_list_file: data/LSUI_val_input.txt
        test_target_images_list_file: data/LSUI_val_target.txt
        size: 256
    test:
      target: src.data.image_enhancement.DatasetTestFromImageFileList
      params:
        test_images_list_file: data/LSUI_val_input.txt
        test_target_images_list_file: data/LSUI_val_target.txt
        size: 256
